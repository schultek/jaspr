name: dart_quotes_server
description: Collection of Dart quotes.
version: 0.1.14-beta.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dart_quotes_client:
    path: ./client
  jaspr: ^0.24.0-beta.0
  jaspr_router: ^0.10.0-beta.0
  jaspr_serverpod: ^0.7.0-beta.0
  serverpod: ^2.3.0
  serverpod_auth_google_flutter: ^2.3.0
  serverpod_auth_server: ^2.3.0
  serverpod_auth_shared_flutter: ^2.3.0
  serverpod_serialization: ^2.3.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.12
  jaspr_builder: ^0.24.0-beta.0

jaspr:
  mode: server
  flutter: plugins
  port: 8082
