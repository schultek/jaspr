on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - next
    paths:
      - '.github/workflows/test.yml'
      - 'apps/**'
      - 'examples/**'
      - 'packages/**'
      - 'pubspec.lock'
  push:
    branches:
      - main
      - next
    paths:
      - '.github/workflows/test.yml'
      - 'apps/**'
      - 'examples/**'
      - 'packages/**'
      - 'pubspec.lock'

name: Test Pipeline

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap
        run: |
          flutter --version
          dart pub get

      - name: Check formatting
        run: dart run melos run format

      - name: Check linting
        run: dart analyze --fatal-infos

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - jaspr
          - jaspr_builder
          - jaspr_cli
          - jaspr_content
          - jaspr_lints
          - jaspr_riverpod
          - jaspr_router
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap
        run: |
          flutter --version
          dart pub global activate coverage
          dart pub get
          mkdir -p coverage

      - name: Run Unit tests
        run: dart run melos run coverage --scope=${{ matrix.package }}

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage/*_lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  test-packages:
    name: Test Packages
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all tests passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more package test jobs failed."
            exit 1
          fi
          echo "All package tests passed successfully."
